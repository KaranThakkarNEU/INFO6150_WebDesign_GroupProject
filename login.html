<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="./login.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="./css/login.css">
</head>

<body>
    <!-- Login Form -->
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <form class="row border rounded-5 p-3 shadow m-3 box-area" id="loginForm" novalidate onsubmit="login()">
            <div class="col-md-6 rounded-4 d-flex justify-content-end align-items-center flex-column left-box">
                <small class="text-bg-dark text-wrap text-center ls-ti mb-1 fs-1 img-text">Join friends and code
                    together</small>
            </div>

            <div class="col-md-6 right-box">
                <div class="row align-items-center">
                    <div class="header-text mb-4">
                        <p class="fs-1 text-center">Login</p>
                    </div>
                    <div class="mb-3">
                        <input class="form-control form-control-lg bg-light fs-6" type="email" id="email"
                            oninput="validateLoginForm('email')" placeholder="Email address"
                            aria-label="default input example" required>
                        <small class="text-danger" id="email-validation"></small>
                    </div>
                    <div class="mb-1">
                        <input class="form-control form-control-lg bg-light fs-6" type="password" id="password"
                            oninput="validateLoginForm('password')" placeholder="Password"
                            aria-label="default input example" required>
                        <small class="text-danger" id="password-validation"></small>
                    </div>
                    <div class="mb-5 d-flex justify-content-between">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="formCheck">
                            <label for="formCheck" class="form-check-label text-secondary"><small>Remember
                                    Me</small></label>
                        </div>
                        <div class="forgot">
                            <small><a href="#">Forgot Password?</a></small>
                        </div>
                    </div>
                    <div class="mb-3">
                        <button type="submit" class="btn btn-lg btn-primary w-100 fs-5">Login</button>
                    </div>
                    <hr class="hr">
                    <div class="mb-3">
                        <button class="btn btn-lg btn-light w-100 fs-5 google-btn">
                            <img src="./images/icon-google.png" alt="google-icon" class="me-1" style="width: 20px;">
                            <small>Sign in with Google</small>
                        </button>
                    </div>
                    <div class="row">
                        <small>Don't have account?<a href="#">Sign up</a></small>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <!-- Login Form End -->

</body>

</html>
