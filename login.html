<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <script src="./login.js"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
      crossorigin="anonymous"
    ></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.3/jquery.min.js"></script>
    <link rel="stylesheet" href="./css/login.css" />
  </head>

  <body>
    <!-- Alert -->
    <div id="liveAlertPlaceholder"></div>

    <!-- Alert End -->

    <!-- Login Form -->
    <div
      class="container d-flex justify-content-center align-items-center min-vh-100"
    >
      <form
        action=""
        class="row border shadow m-3 box-area"
        id="loginForm"
        novalidate
      >
        <div class="col-md-6 left-box">
          <div class="row align-items-center">
            <div class="header-text mb-4">
              <p class="fs-1 text-center fw-bold">Login to Your Account</p>
            </div>
            <div class="mb-3 d-flex flex-wrap justify-content-center">
              <input
                class="form-control form-control-lg bg-light fs-6 w-75"
                type="email"
                id="email"
                oninput="validateLoginForm('email')"
                placeholder="Email address"
                aria-label="default input example"
                required
              />
              <small class="text-danger" id="email-validation"></small>
            </div>
            <div class="mb-1 d-flex flex-wrap justify-content-center">
              <input
                class="form-control form-control-lg bg-light fs-6 w-75"
                type="password"
                id="password"
                oninput="validateLoginForm('password')"
                placeholder="Password"
                aria-label="default input example"
                required
              />
              <small class="text-danger" id="password-validation"></small>
            </div>
            <div class="mb-5 d-flex justify-content-around">
              <div class="form-check">
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="formCheck"
                />
                <label for="formCheck" class="form-check-label text-secondary"
                  ><small>Remember Me</small></label
                >
              </div>
              <div class="forgot">
                <small
                  ><a
                    href="#"
                    data-bs-target="#forgotPasswordModal"
                    data-bs-toggle="modal"
                    >Forgot Password?</a
                  ></small
                >
              </div>
            </div>
            <div class="mb-3 text-center">
              <button
                type="submit"
                class="btn btn-lg btn-primary w-50 fs-5 rounded-pill"
                id="liveAlertBtn"
                onclick="login()"
              >
                Login
              </button>
            </div>
            <hr class="hr" />

            <div class="mb-3 text-center">
              <button class="btn btn-lg btn-light w-75 fs-5 google-btn">
                <img
                  src="./images/icon-google.png"
                  alt="google-icon"
                  class="me-1"
                  style="width: 20px"
                />
                <small>Sign in with Google</small>
              </button>
            </div>
          </div>
        </div>
        <div
          class="col-md-6 d-flex align-items-center flex-column right-box justify-content-center text-center"
        >
          <h1 class="mb-4 text-white fw-bold">New Here?</h1>
          <p class="mb-4 h5 text-white">
            Signup and discover a great amount of new opportunities!
          </p>
          <a
            class="btn btn-lg btn-primary w-50 fs-5 text-black bg-white rounded-pill"
            type="submit"
            data-bs-target="#signupModal"
            data-bs-toggle="modal"
          >
            Sign Up
          </a>
        </div>
      </form>
    </div>
    <!-- Login Form End -->

    <!-- Signup modal Start -->
    <div
      class="modal fade"
      id="signupModal"
      tabindex="-1"
      aria-labelledby="signupModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="signupModalLabel">
              Create New Account
            </h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <input
              class="form-control form-control-lg bg-light fs-6 mb-3"
              type="emailId"
              id="emailId"
              placeholder="Email address"
              aria-label="default input example"
              required
            />
            <input
              class="form-control form-control-lg bg-light fs-6 mb-3"
              type="password"
              id="signupPassword"
              placeholder="Password"
              aria-label="default input example"
              required
            />
            <input
              class="form-control form-control-lg bg-light fs-6 mb-3"
              type="confirmPassword"
              id="confirmPassword"
              placeholder="Confirm Password"
              aria-label="default input example"
              required
            />
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Close
            </button>
            <button
              type="button"
              class="btn btn-primary"
              data-bs-dismiss="modal"
            >
              Create
            </button>
          </div>
        </div>
      </div>
    </div>
    <!--  Signup modal End -->

    <!-- Vertically centered modal -->
    <div
      class="modal fade"
      id="forgotPasswordModal"
      tabindex="-1"
      aria-labelledby="forgotPasswordModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="forgotPasswordModalLabel">
              Forgot Password
            </h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <input
              class="form-control form-control-lg bg-light fs-6"
              type="forgotPassword"
              id="forgotPassword"
              placeholder="Email address"
              aria-label="default input example"
              required
            />
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Close
            </button>
            <button
              type="button"
              class="btn btn-primary"
              data-bs-dismiss="modal"
            >
              Send Email
            </button>
          </div>
        </div>
      </div>
    </div>
    <!--  Vertically centered modal End -->
  </body>
</html>
